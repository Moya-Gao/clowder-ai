name: PR Follow-up Guard

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize]

concurrency:
  group: pr-followup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  followup-tails:
    name: Follow-up Tail Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-followup-tails.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
