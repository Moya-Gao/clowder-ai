<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <title>Clowder AI - Hero Prism</title>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#0F172A"/>

  <!-- Definitions -->
  <defs>
    <!-- Light Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Beam Glows -->
    <filter id="glow-beam" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Color Blind Safe Styles: Distinct dash patterns -->
    <style>
      .beam-opus { stroke: #60A5FA; stroke-dasharray: none; }
      .beam-codex { stroke: #34D399; stroke-dasharray: 12 8; }
      .beam-gemini { stroke: #FBBF24; stroke-dasharray: 4 6; }
      .text-label { fill: #94A3B8; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
      .text-title { fill: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; }
    </style>
  </defs>

  <!-- Meta Labels -->
  <text x="40" y="40" class="text-title">Hard Rails. Soft Power. Shared Mission.</text>
  <text x="40" y="65" class="text-label">Semantic: Vision → Hard Rails → Collaboration &amp; Memory</text>

  <!-- 1. White Light (Vision) -->
  <path d="M 0 250 L 350 250" stroke="#FFFFFF" stroke-width="8" filter="url(#glow)" />
  <text x="120" y="235" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="16px">Vision (White Light)</text>

  <!-- 4. Energy Rings (Memory & Audit) -->
  <ellipse cx="400" cy="250" rx="120" ry="40" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" transform="rotate(-15 400 250)" />
  <ellipse cx="400" cy="250" rx="140" ry="50" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="10 10" transform="rotate(15 400 250)" />
  <text x="420" y="160" class="text-label">Memory &amp; Audit (Rings)</text>

  <!-- 2. The Prism (Hard Rails) -->
  <polygon points="400,150 480,330 320,330" fill="rgba(255, 255, 255, 0.05)" stroke="#94A3B8" stroke-width="3" />
  <polygon points="400,150 480,330 320,330" fill="none" stroke="#FFFFFF" stroke-width="1" filter="url(#glow)" opacity="0.6"/>
  <text x="360" y="365" class="text-title">Hard Rails</text>
  
  <!-- 3. Dispersed Colors (Collaboration) -->
  <!-- Opus Blue Beam (Solid) -->
  <path d="M 430 220 L 800 120" class="beam-opus" stroke-width="12" filter="url(#glow-beam)" opacity="0.9" />
  <text x="630" y="150" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="14px" font-weight="bold">Opus (Architecture)</text>

  <!-- Codex Green Beam (Long Dashes) -->
  <path d="M 445 250 L 800 250" class="beam-codex" stroke-width="12" filter="url(#glow-beam)" opacity="0.9" />
  <text x="630" y="240" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="14px" font-weight="bold">Codex (Review)</text>

  <!-- Gemini Amber Beam (Short Dashes) -->
  <path d="M 430 280 L 800 380" class="beam-gemini" stroke-width="12" filter="url(#glow-beam)" opacity="0.9" />
  <text x="630" y="360" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="14px" font-weight="bold">Gemini (Design)</text>

</svg>
