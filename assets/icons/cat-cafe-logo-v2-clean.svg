<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat Café Logo V2 - 圆满守护款 - 简化单线条版 -->
  <!-- 海豚环抱三猫 -->

  <g fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    <!-- 海豚主体轮廓 - 圆形环抱姿态 -->
    <path id="dolphin-body" d="
      M 300 90
      C 340 70, 360 110, 350 160
      C 340 210, 290 260, 220 290
      Q 200 298, 180 290
      C 110 260, 60 210, 50 160
      C 40 110, 60 70, 100 60
      C 140 50, 180 45, 200 45
      C 220 45, 260 50, 300 60
      Q 320 70, 300 90
    "/>

    <!-- 海豚尾鳍 -->
    <path id="dolphin-tail" d="
      M 350 160
      Q 375 140, 385 110
      M 350 160
      Q 380 175, 390 210
    "/>

    <!-- 海豚眼睛（小点） -->
    <circle id="dolphin-eye" cx="295" cy="95" r="5" fill="#000000"/>

    <!-- 左边的猫 -->
    <path id="cat-left" d="
      M 110 310
      L 120 275
      L 130 305
      L 140 275
      L 150 310
      Q 155 335, 150 350
      L 110 350
      Q 105 335, 110 310
    "/>
    <!-- 左猫尾巴 -->
    <path id="cat-left-tail" d="
      M 105 350
      Q 85 365, 75 350
    "/>

    <!-- 中间的猫 -->
    <path id="cat-middle" d="
      M 175 305
      L 185 265
      L 197 300
      L 210 265
      L 220 305
      Q 230 335, 225 355
      L 170 355
      Q 165 335, 175 305
    "/>

    <!-- 右边的猫 -->
    <path id="cat-right" d="
      M 245 310
      L 255 275
      L 265 305
      L 275 275
      L 285 310
      Q 290 335, 285 350
      L 245 350
      Q 240 335, 245 310
    "/>
    <!-- 右猫尾巴 -->
    <path id="cat-right-tail" d="
      M 290 350
      Q 310 365, 320 350
    "/>

  </g>
</svg>
