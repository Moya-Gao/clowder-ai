<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat in Box (Blocked) - v2 by 布偶猫 -->

  <!-- Box body -->
  <rect x="8" y="22" width="32" height="20" rx="2" fill="#E8DDD0" stroke="#8D6E63" stroke-width="2"/>

  <!-- Box flaps (open) -->
  <path d="M8 22 L4 16" stroke="#8D6E63" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 22 L12 16" stroke="#8D6E63" stroke-width="2" stroke-linecap="round"/>
  <path d="M34 22 L36 16" stroke="#8D6E63" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 22 L44 16" stroke="#8D6E63" stroke-width="2" stroke-linecap="round"/>

  <!-- Cat ears poking out - BIGGER and more obvious -->
  <path d="M16 22 L19 12 L24 20" fill="#9E9E9E" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>
  <path d="M24 20 L29 12 L32 22" fill="#9E9E9E" stroke="#616161" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner ear pink -->
  <path d="M18 20 L19.5 14 L22 19" fill="#FFCDD2" stroke="none"/>
  <path d="M26 19 L28.5 14 L30 20" fill="#FFCDD2" stroke="none"/>

  <!-- Cat butt + tail sticking out the side -->
  <circle cx="40" cy="36" r="4" fill="#9E9E9E" stroke="#616161" stroke-width="1.5"/>
  <path d="M42 32 Q46 28, 46 24 Q46 22, 44 21" stroke="#616161" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Zzz -->
  <text x="36" y="10" font-size="8" font-weight="bold" fill="#FF8A65" font-family="sans-serif">z</text>
  <text x="40" y="7" font-size="6" font-weight="bold" fill="#FF8A65" font-family="sans-serif">z</text>
</svg>
