<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Unravelling Yarn Ball (Doing) - v2 by 布偶猫 -->

  <!-- Ball body - slightly smaller, yarn is coming undone -->
  <circle cx="22" cy="24" r="13" fill="#D5C4F7"/>

  <!-- Yarn texture -->
  <path d="M11 20 Q16 18, 22 19 Q28 20, 33 18" stroke="#B8A0E0" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M10 26 Q16 28, 22 27 Q28 26, 34 28" stroke="#B8A0E0" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M14 14 Q18 20, 19 28 Q20 33, 22 36" stroke="#C8B0F0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M30 14 Q27 20, 26 28 Q25 33, 23 36" stroke="#C8B0F0" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Highlight -->
  <circle cx="18" cy="20" r="4" fill="white" fill-opacity="0.2"/>

  <!-- Unravelling thread - long, wavy, dynamic -->
  <path d="M33 22 Q38 20, 40 24 Q42 28, 39 32 Q36 36, 40 40 Q43 43, 46 42"
        stroke="#9B7EBD" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Motion lines near the unravelling point -->
  <line x1="35" y1="19" x2="37" y2="17" stroke="#9B7EBD" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="36" y1="22" x2="38" y2="21" stroke="#9B7EBD" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
</svg>
