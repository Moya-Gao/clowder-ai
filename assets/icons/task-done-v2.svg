<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Happy Cat with Yarn (Done) - v2 by 布偶猫 -->

  <!-- Messy unrolled yarn underneath -->
  <path d="M6 38 Q12 34, 18 36 Q24 38, 30 35 Q36 32, 42 36" stroke="#C8E6C9" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M10 42 Q16 39, 22 41 Q28 43, 34 40 Q38 38, 42 40" stroke="#A5D6A7" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Small yarn ball remnant -->
  <circle cx="38" cy="36" r="5" fill="#C8E6C9"/>
  <path d="M34 34 Q37 33, 40 34" stroke="#A5D6A7" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M35 38 Q37 39, 41 38" stroke="#A5D6A7" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Cat body - curled up satisfied -->
  <ellipse cx="22" cy="30" rx="14" ry="10" fill="#9E9E9E"/>

  <!-- Cat head -->
  <circle cx="14" cy="22" r="8" fill="#BDBDBD"/>

  <!-- Ears -->
  <path d="M8 16 L10 8 L16 14" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M14 14 L18 7 L22 15" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M10 14 L10.5 10 L14 13" fill="#FFCDD2" stroke="none"/>
  <path d="M16 13 L17.5 9 L20 14" fill="#FFCDD2" stroke="none"/>

  <!-- Closed happy eyes (^_^) -->
  <path d="M10 22 Q12 20, 14 22" stroke="#424242" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M16 21 Q18 19, 20 21" stroke="#424242" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Tiny smile -->
  <path d="M13 25 Q14 27, 16 25" stroke="#424242" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Tail curled around -->
  <path d="M34 26 Q38 22, 36 18 Q34 14, 30 16" stroke="#9E9E9E" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Sparkles -->
  <text x="28" y="12" font-size="8" fill="#FFD54F">✦</text>
  <text x="4" y="34" font-size="6" fill="#FFD54F">✦</text>
</svg>
