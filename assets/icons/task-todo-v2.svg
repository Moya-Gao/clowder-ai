<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Neat Yarn Ball (Todo) - v2 by 布偶猫 -->

  <!-- Ball body -->
  <circle cx="24" cy="24" r="16" fill="#E8D5B7"/>

  <!-- Yarn texture: crossing strands that look like wound thread -->
  <!-- Horizontal-ish wraps -->
  <path d="M10 20 Q17 17, 24 18 Q31 19, 38 16" stroke="#C4A882" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M9 26 Q16 29, 24 28 Q32 27, 39 30" stroke="#C4A882" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Diagonal wraps -->
  <path d="M14 12 Q18 20, 20 28 Q22 34, 26 38" stroke="#D4B896" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M34 12 Q30 20, 28 28 Q26 34, 22 38" stroke="#D4B896" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- More wraps for fullness -->
  <path d="M12 16 Q20 14, 28 16 Q34 18, 36 22" stroke="#CAAD7E" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M12 32 Q20 34, 28 32 Q34 30, 36 26" stroke="#CAAD7E" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Highlight for 3D feel -->
  <circle cx="20" cy="19" r="5" fill="white" fill-opacity="0.2"/>

  <!-- Loose thread end poking out -->
  <path d="M36 28 Q40 30, 42 34 Q43 37, 41 39" stroke="#C4A882" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
