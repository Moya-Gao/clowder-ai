# Cat Cafe isolated Hindsight service
# Usage:
#   docker compose -f docker-compose.hindsight.yml up -d --pull always
#   docker compose -f docker-compose.hindsight.yml down

services:
  hindsight-volume-init:
    image: ghcr.io/vectorize-io/hindsight:latest
    user: "0:0"
    entrypoint:
      - sh
      - -lc
      - mkdir -p /home/hindsight/.pg0 && chown -R 1000:1000 /home/hindsight/.pg0 && chmod 700 /home/hindsight/.pg0
    restart: "no"
    volumes:
      - cat-cafe-hindsight-data:/home/hindsight/.pg0

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: cat-cafe-hindsight-memory
    restart: unless-stopped
    depends_on:
      hindsight-volume-init:
        condition: service_completed_successfully
    ports:
      - "18888:8888" # API
      - "19999:9999" # Control Plane UI
    environment:
      # Use Codex OAuth by default (no API key needed)
      HINDSIGHT_API_LLM_PROVIDER: openai-codex
      HINDSIGHT_API_LLM_MODEL: gpt-5.2-codex
      HINDSIGHT_API_LLM_MAX_CONCURRENT: ${HINDSIGHT_API_LLM_MAX_CONCURRENT:-4}
      HINDSIGHT_API_LLM_TIMEOUT: ${HINDSIGHT_API_LLM_TIMEOUT:-30}

      # Local embeddings/reranker defaults
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_API_EMBEDDINGS_PROVIDER:-local}
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: ${HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL:-BAAI/bge-small-en-v1.5}
      HINDSIGHT_API_RERANKER_PROVIDER: ${HINDSIGHT_API_RERANKER_PROVIDER:-local}
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: ${HINDSIGHT_API_RERANKER_LOCAL_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}

      HINDSIGHT_API_LOG_LEVEL: ${HINDSIGHT_API_LOG_LEVEL:-info}
    volumes:
      - cat-cafe-hindsight-data:/home/hindsight/.pg0
      - ${HOME}/.cache/huggingface:/home/hindsight/.cache/huggingface
      - ${HOME}/.codex:/home/hindsight/.codex:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cat-cafe-hindsight-data:
    driver: local
