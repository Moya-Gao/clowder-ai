<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Figure 2 — Capability multiplied by environment fit</title>
  <desc id="desc">A four-quadrant diagram plotting model capability against environment fit. The top-left is Build to Delete, the top-right is the Sweet Spot, the bottom-left is the Dead Zone, and the bottom-right is Built to Persist.</desc>
  <defs>
    <style>
      .paper { fill: #fffaf0; }
      .ink { fill: #25313b; font-family: "Chalkboard SE", "Comic Sans MS", "Inter", "Segoe UI", sans-serif; }
      .title { font-size: 48px; font-weight: 800; }
      .subtitle { font-size: 24px; fill: #5b6672; }
      .axis { font-size: 28px; font-weight: 800; }
      .quadTitle { font-size: 34px; font-weight: 850; }
      .quadSub { font-size: 21px; font-weight: 700; fill: #3f4b57; }
      .body { font-size: 20px; fill: #4d5965; }
      .small { font-size: 18px; fill: #5a6470; }
      .noteTitle { font-size: 23px; font-weight: 800; }
      .note { font-size: 18px; fill: #44505b; }
      .line { fill: none; stroke: #25313b; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #25313b; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 10 10; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#25313b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f7d4b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a0443d"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#6f6252" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect class="paper" width="1600" height="1100"/>
  <path class="thin" d="M42 46 C300 23 520 44 760 31 C1044 16 1308 28 1555 48" opacity="0.24"/>
  <path class="thin" d="M48 1018 C304 1040 582 1018 820 1030 C1110 1044 1324 1030 1548 1015" opacity="0.20"/>

  <text class="ink title" x="78" y="92">Capability × Environment Fit</text>
  <text class="ink subtitle" x="82" y="130">Model capability compounds only when the world around the model is engineered to persist.</text>

  <!-- Plot area -->
  <g filter="url(#softShadow)">
    <rect x="226" y="210" width="1088" height="690" rx="28" fill="#fffdfa" stroke="#25313b" stroke-width="4.5"/>
    <path d="M770 211 C762 355 772 534 768 901" class="line" opacity="0.78"/>
    <path d="M226 555 C492 548 820 562 1314 553" class="line" opacity="0.78"/>

    <!-- Quadrant fills -->
    <path d="M250 236 C392 224 610 231 746 238 C756 332 752 453 748 535 C590 544 402 535 250 542 C236 452 238 326 250 236 Z" fill="#ffe8e0" opacity="0.86"/>
    <path d="M792 236 C938 224 1132 232 1291 240 C1300 333 1293 456 1290 535 C1130 543 948 536 792 542 C783 450 786 326 792 236 Z" fill="#dcf5df" opacity="0.90"/>
    <path d="M250 577 C396 566 594 572 746 580 C754 677 752 795 746 876 C588 888 408 878 250 882 C238 786 240 674 250 577 Z" fill="#eef0f4" opacity="0.94"/>
    <path d="M792 577 C938 566 1130 572 1290 580 C1300 675 1294 794 1290 876 C1128 888 948 879 792 882 C783 786 786 674 792 577 Z" fill="#e6efff" opacity="0.92"/>

    <!-- Main axes, redrawn on top -->
    <path d="M770 900 C762 720 772 490 768 214" class="line" marker-end="url(#arrow)"/>
    <path d="M226 555 C520 548 906 562 1314 553" class="line" marker-end="url(#arrow)"/>

    <!-- Quadrant content -->
    <text class="ink quadTitle" x="304" y="300">Build to Delete</text>
    <text class="ink quadSub" x="304" y="332">High capability, low environment fit</text>
    <text class="ink body" x="304" y="382">Strong models compensate for missing</text>
    <text class="ink body" x="304" y="410">infrastructure with brute-force reasoning.</text>
    <text class="ink small" x="304" y="462">Examples:</text>
    <text class="ink small" x="328" y="492">chain-of-thought templates</text>
    <text class="ink small" x="328" y="520">manual recovery boilerplate</text>
    <text class="ink small" x="328" y="548">brittle format prompts</text>

    <text class="ink quadTitle" x="858" y="300">Sweet Spot</text>
    <text class="ink quadSub" x="858" y="332">High capability, high environment fit</text>
    <text class="ink body" x="858" y="382">The model is strong, and the environment</text>
    <text class="ink body" x="858" y="410">lets that strength compound.</text>
    <text class="ink small" x="858" y="462">Signals:</text>
    <text class="ink small" x="882" y="492">shared reality</text>
    <text class="ink small" x="882" y="520">verification loops</text>
    <text class="ink small" x="882" y="548">cross-agent memory</text>

    <text class="ink quadTitle" x="304" y="650">Dead Zone</text>
    <text class="ink quadSub" x="304" y="682">Low capability, low environment fit</text>
    <text class="ink body" x="304" y="730">Weak models in bare environments</text>
    <text class="ink body" x="304" y="758">cannot form a useful loop.</text>
    <text class="ink small" x="304" y="810">Symptoms:</text>
    <text class="ink small" x="328" y="840">demo-only workflows</text>
    <text class="ink small" x="328" y="868">no persistent state</text>

    <text class="ink quadTitle" x="858" y="650">Built to Persist</text>
    <text class="ink quadSub" x="858" y="682">Low capability, high environment fit</text>
    <text class="ink body" x="858" y="730">The environment is ready before the</text>
    <text class="ink body" x="858" y="758">next model generation fully exploits it.</text>
    <text class="ink small" x="858" y="810">Examples:</text>
    <text class="ink small" x="882" y="840">git / docs / search tools</text>
    <text class="ink small" x="882" y="868">traces / tests / review gates</text>

    <!-- Path arrows -->
    <path d="M395 760 C526 684 650 628 760 555 C884 472 995 391 1123 320" fill="none" stroke="#2f7d4b" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)" opacity="0.68"/>

    <path d="M407 760 C408 633 407 500 407 333" fill="none" stroke="#a0443d" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="13 12" marker-end="url(#arrowRed)" opacity="0.64"/>
  </g>

  <!-- Axis labels -->
  <text class="ink axis" x="585" y="978">Environment Fit</text>
  <text class="ink small" x="301" y="978">low</text>
  <text class="ink small" x="1238" y="978">high</text>

  <g transform="translate(118 680) rotate(-90)">
    <text class="ink axis">Model Capability</text>
  </g>
  <text class="ink small" x="138" y="855">low</text>
  <text class="ink small" x="136" y="250">high</text>

  <!-- Discriminant note -->
  <path d="M1380 292 C1442 278 1512 292 1532 342 C1548 404 1514 474 1450 484 C1390 496 1328 464 1320 404 C1312 350 1330 308 1380 292 Z" fill="#fffdfa" stroke="#25313b" stroke-width="3.5"/>
  <text class="ink noteTitle" x="1352" y="346">Discriminant</text>
  <text class="ink note" x="1352" y="382">If the next model</text>
  <text class="ink note" x="1352" y="410">upgrade makes it</text>
  <text class="ink note" x="1352" y="438">less useful, delete.</text>

  <path d="M1366 602 C1422 588 1500 602 1527 646 C1554 700 1518 760 1454 774 C1392 788 1330 758 1320 704 C1308 650 1326 614 1366 602 Z" fill="#fffdfa" stroke="#25313b" stroke-width="3.5"/>
  <text class="ink noteTitle" x="1350" y="652">Persistence test</text>
  <text class="ink note" x="1350" y="688">If the upgrade makes</text>
  <text class="ink note" x="1350" y="716">it more useful, harden</text>
  <text class="ink note" x="1350" y="744">and measure it.</text>
</svg>
