      execute_mechanism: mcp-tool
      exit_condition: "results returned or timeout"
    eval:
      activation_signal: pending  # F200 定义
      friction_metric: pending
      success_signal: pending
      regression_fixtures: []
    governance:
      owner: codex
      upgrade_criteria: pending
      degrade_criteria: pending
      sunset_signal: pending
    interfaces:
      trace: pending
      eval: F200
      feedback: pending
      governance: pending

  - id: route-serial
    name: "A2A Serial Routing"
    type: guard
    status: active
    owner: opus
    description: "Ensures valid @mention or hold_ball at session end (传球决策树)."
    runtime:
      load_trigger: static  # injected in every dispatch context
      execute_mechanism: prompt-injection
      exit_condition: "cat produces valid ball-pass action"
    eval:
      activation_signal: pending
      friction_metric: pending
      success_signal: pending
      regression_fixtures: []
    governance:
      owner: opus
      upgrade_criteria: pending
      degrade_criteria: pending
      sunset_signal: pending
    interfaces:
      trace: pending
      eval: pending
      feedback: pending
      governance: pending
