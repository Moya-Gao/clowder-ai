# Cat Cafe Harness Registry (F208)
# Status: Pilot Phase
# Schema: docs/harness-control-plane/README.md

units:
  - id: hold_ball
    name: "Ball Ownership (Hold)"
    type: tool
    status: active
    owner: opus
    description: "Allows a cat to hold the conversation baton while waiting for a bounded external condition (CI, PR checks)."

    # Three-Layer Contract
    runtime:
      load_trigger: dynamic  # injected when dispatch detects external wait condition
      execute_mechanism: mcp-tool  # cat_cafe_hold_ball MCP tool
      exit_condition: "wakeAfterMs expires OR user cancels OR cat releases"
    eval:
      activation_signal: "cat_cafe.hold_ball.registered counter increments (OTel)"
      friction_metric: "1 - (cat_cafe.hold_ball.cancelled_with_reason / cat_cafe.hold_ball.cancelled); target < 20%"
      success_signal: "Wake-up fires, cat executes nextStep without user intervention"
      regression_fixtures:
        - "hold → wake → nextStep executes (happy path)"
        - "hold → timeout → zombie detection fires"
        - "hold → cancel with reason → reason field non-empty"
    governance:
      owner: opus
      upgrade_criteria: "friction_rate < 10% AND trust_gap_rate < 5% over 2 weeks → promote to always-on"
      degrade_criteria: "friction_rate > 30% OR trust_gap_rate > 20% OR zombie_rate > 15% → add manual confirmation"
      sunset_signal: "Zero holdBallRegistered for 3 months + CI webhooks cover all wait cases"

    interfaces:
      trace: "OTel counters: hold_ball.registered/.cancelled/.cancelled_with_reason/.rejected"
      eval: "Thread-segment observation — trust_gap detection via cancel reason analysis"
      feedback: "Cancel reason field (TRUST_GAP/HARNESS_GAP/STUCK/OTHER) + free-text message"
      governance: "Weekly threshold check + monthly registry review. See hold-ball-phase-b.md §4"

  - id: search_evidence
    name: "Memory Recall"
    type: tool
    status: active
    owner: codex
    description: "Primary entry point for project memory recall (search + graph + list)."
    runtime:
      load_trigger: static  # always available via MCP
      execute_mechanism: mcp-tool
      exit_condition: "results returned or timeout"
    eval:
      activation_signal: pending  # F200 定义
      friction_metric: pending
      success_signal: pending
      regression_fixtures: []
    governance:
      owner: codex
      upgrade_criteria: pending
      degrade_criteria: pending
      sunset_signal: pending
    interfaces:
      trace: pending
      eval: F200
      feedback: pending
      governance: pending

  - id: route-serial
    name: "A2A Serial Routing"
    type: guard
    status: active
    owner: opus
    description: "Ensures valid @mention or hold_ball at session end (传球决策树)."
    runtime:
      load_trigger: static  # injected in every dispatch context
      execute_mechanism: prompt-injection
      exit_condition: "cat produces valid ball-pass action"
    eval:
      activation_signal: pending
      friction_metric: pending
      success_signal: pending
      regression_fixtures: []
    governance:
      owner: opus
      upgrade_criteria: pending
      degrade_criteria: pending
      sunset_signal: pending
    interfaces:
      trace: pending
      eval: pending
      feedback: pending
      governance: pending
