<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4e342e" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font-family: 'Inter', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: #3e2723; }
      .axis-label { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #5d4037; }
      .quad-title { font-family: 'Inter', system-ui, sans-serif; font-size: 22px; font-weight: 800; }
      .quad-desc { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #6d4c41; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8d6e63" />
    </marker>
  </defs>

  <rect width="800" height="650" fill="#fdfbf7" rx="16"/>
  <text x="400" y="35" class="title" text-anchor="middle">Agent 技能评测矩阵 (触发质量 × 交付质量)</text>

  <!-- Axes -->
  <line x1="80" y1="335" x2="720" y2="335" stroke="#bcaaa4" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="400" y1="580" x2="400" y2="85" stroke="#bcaaa4" stroke-width="4" marker-end="url(#arrow)"/>
  
  <text x="730" y="340" class="axis-label" text-anchor="start">Routing (触发质量)</text>
  <text x="400" y="65" class="axis-label" text-anchor="middle">Delivery (交付质量)</text>

  <!-- Top Left Quad (High Delivery, Low Routing) -->
  <g transform="translate(100, 120)">
    <rect width="280" height="180" rx="12" fill="#fff3e0" filter="url(#shadow)"/>
    <text x="140" y="60" class="quad-title" text-anchor="middle" fill="#e65100">Under-trigger</text>
    <text x="140" y="100" class="quad-desc" text-anchor="middle">Description 太弱、缺触发词</text>
    <text x="140" y="125" class="quad-desc" text-anchor="middle">技能做得好，但经常不被用到</text>
  </g>

  <!-- Top Right Quad (High Delivery, High Routing) -->
  <g transform="translate(420, 120)">
    <rect width="280" height="180" rx="12" fill="#e8f5e9" filter="url(#shadow)"/>
    <text x="140" y="60" class="quad-title" text-anchor="middle" fill="#2e7d32">✅ Ready to Ship</text>
    <text x="140" y="100" class="quad-desc" text-anchor="middle">精准触发，稳定交付</text>
    <text x="140" y="125" class="quad-desc" text-anchor="middle">满足 Output Contract 无意外</text>
  </g>

  <!-- Bottom Left Quad (Low Delivery, Low Routing) -->
  <g transform="translate(100, 370)">
    <rect width="280" height="180" rx="12" fill="#ffebee" filter="url(#shadow)"/>
    <text x="140" y="60" class="quad-title" text-anchor="middle" fill="#c62828">Needs Redesign</text>
    <text x="140" y="100" class="quad-desc" text-anchor="middle">重构技能，重新定义范围</text>
    <text x="140" y="125" class="quad-desc" text-anchor="middle">或者拆分成多个细粒度技能</text>
  </g>

  <!-- Bottom Right Quad (Low Delivery, High Routing) -->
  <g transform="translate(420, 370)">
    <rect width="280" height="180" rx="12" fill="#f3e5f5" filter="url(#shadow)"/>
    <text x="140" y="60" class="quad-title" text-anchor="middle" fill="#6a1b9a">Over-trigger</text>
    <text x="140" y="100" class="quad-desc" text-anchor="middle">触发太宽（常发生误触发）</text>
    <text x="140" y="125" class="quad-desc" text-anchor="middle">或 workflow / 自检规则太宽</text>
  </g>

  <!-- Labels on Axis -->
  <g transform="translate(385, 460) rotate(-90)">
    <text x="0" y="0" class="axis-label" fill="#8d6e63" font-size="15" text-anchor="middle">Low Delivery</text>
  </g>
  <g transform="translate(385, 210) rotate(-90)">
    <text x="0" y="0" class="axis-label" fill="#8d6e63" font-size="15" text-anchor="middle">High Delivery</text>
  </g>

  <text x="240" y="360" class="axis-label" fill="#8d6e63" font-size="15" text-anchor="middle">Low Routing</text>
  <text x="560" y="360" class="axis-label" fill="#8d6e63" font-size="15" text-anchor="middle">High Routing</text>
</svg>
