<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>V Lane Placeholder</title>
<style>
  /* 故意做成"显然不是成片"的工程占位卡：斜纹边 + 标签，防止被误当最终素材 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 720px; height: 1280px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: repeating-linear-gradient(45deg, #e8e2d6 0 24px, #ded6c6 24px 48px);
    display: flex; align-items: center; justify-content: center;
  }
  .slug {
    width: 600px; min-height: 720px; background: #f7f3ea;
    border: 6px dashed #b9ac94; border-radius: 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px; padding: 48px; text-align: center;
  }
  .tag {
    background: #6b5d44; color: #f7f3ea; font-size: 22px; letter-spacing: 4px;
    padding: 8px 22px; border-radius: 999px; font-weight: 700;
  }
  .shot-id { font-size: 110px; font-weight: 800; color: #4a4032; line-height: 1; }
  .lane { font-size: 30px; color: #8a7a5e; font-weight: 700; }
  .beat { font-size: 34px; color: #4a4032; line-height: 1.5; font-weight: 600; }
  .dur { font-size: 26px; color: #8a7a5e; }
  .paw { font-size: 56px; }
  .subs { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .subs:empty { display: none; }
  .sub-line {
    background: rgba(74, 64, 50, 0.88); color: #f7f3ea; font-size: 26px;
    padding: 10px 18px; border-radius: 12px; line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="slug">
    <div class="tag">V LANE PLACEHOLDER</div>
    <div class="paw">🐾</div>
    <div class="shot-id" data-field="shot">S?</div>
    <div class="lane" data-field="lane"></div>
    <div class="beat" data-field="beat"></div>
    <div class="dur" data-field="dur"></div>
    <div class="subs" data-field="subs"></div>
  </div>
  <script>
    // 无 module import，file:// 直开安全（animatic build 脚本走 file:// 抓图）
    var params = new URLSearchParams(location.search);
    function setField(name, value) {
      document.querySelector('[data-field="' + name + '"]').textContent = value || '';
    }
    setField('shot', params.get('shot') || 'S?');
    setField('lane', params.get('lane') || '');
    setField('beat', params.get('beat') || '');
    setField('dur', params.get('dur') ? params.get('dur') + 's · 待 Wave V 素材替换' : '');
    // 对白行（| 分隔）：animatic 占位卡直接展示台词，不依赖 ffmpeg 文字渲染
    var subsBox = document.querySelector('[data-field="subs"]');
    (params.get('subs') || '').split('|').filter(Boolean).forEach(function (line) {
      var el = document.createElement('div');
      el.className = 'sub-line';
      el.textContent = line;
      subsBox.appendChild(el);
    });
  </script>
</body>
</html>
