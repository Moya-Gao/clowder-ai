<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Subtitle Strip</title>
<style>
  /* 透明字幕条：Chrome --default-background-color=00000000 截图 → PNG 带 alpha → ffmpeg overlay */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; background: transparent; overflow: hidden; }
  body { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 18px; }
  .line {
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: clamp(28px, 4.2vw, 40px); font-weight: 700; color: #ffffff; line-height: 1.35;
    background: rgba(0, 0, 0, 0.55); padding: 8px 26px; border-radius: 14px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); max-width: 92vw; text-align: center;
  }
  /* 内心 OS：暖灰金斜体，区别于对白（醋醋喵的小心思专用） */
  .line.os {
    color: #ead9b0; font-style: italic; font-weight: 600; font-size: clamp(25px, 3.8vw, 36px);
    background: rgba(20, 12, 4, 0.72);
  }
</style>
</head>
<body>
  <div class="line" data-field="text"></div>
  <script>
    var params = new URLSearchParams(location.search);
    var el = document.querySelector('[data-field="text"]');
    el.textContent = params.get('text') || '';
    if (params.get('os') === '1') el.classList.add('os');
  </script>
</body>
</html>
