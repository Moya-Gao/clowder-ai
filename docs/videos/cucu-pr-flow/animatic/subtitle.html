<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Subtitle Strip</title>
<style>
  /* 透明字幕条：Chrome --default-background-color=00000000 截图 → PNG 带 alpha → ffmpeg overlay */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 160px; background: transparent; overflow: hidden; }
  body { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 18px; }
  .line {
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: 40px; font-weight: 700; color: #ffffff; line-height: 1.35;
    background: rgba(0, 0, 0, 0.55); padding: 8px 26px; border-radius: 14px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); max-width: 1180px; text-align: center;
  }
</style>
</head>
<body>
  <div class="line" data-field="text"></div>
  <script>
    var params = new URLSearchParams(location.search);
    document.querySelector('[data-field="text"]').textContent = params.get('text') || '';
  </script>
</body>
</html>
