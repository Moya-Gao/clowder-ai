# sync-manifest.yaml — Cat Café → Clowder AI 开源同步清单
# 版本: 3
# 更新: 2026-03-12
# 三猫共识: allowlist export（白名单导出），不是 blacklist deletion
# docs/ 细粒度导出（三猫 + 铲屎官共识 2026-03-12）

version: 3
target_repo: clowder-ai
license: MIT

# ── 整包导出（managed_roots）──────────────────────────────────
# 整个目录树导出，包含 package.json/tsconfig/src/test 等所有构建闭包文件
managed_roots:
  - packages/api
  - packages/web
  - packages/shared
  - packages/mcp-server
  - cat-cafe-skills        # 运行时依赖 + 核心差异化
  - docs/architecture      # 架构文档（直出）
  # 注：猫猫头像在 packages/web/public/avatars/ 中，已被 packages/web 整包包含

# ── 单文件导出（managed_files）────────────────────────────────
managed_files:
  - package.json
  - pnpm-workspace.yaml
  - pnpm-lock.yaml
  - tsconfig.base.json
  - biome.json
  - .dir-exceptions.json
  - .gitignore
  - .npmrc
  - SECURITY.md
  - CODEOWNERS
  - CLA.md
  - TRADEMARKS.md
  - .github/workflows/ci.yml
  # docs/ 单文件导出（需 transform）
  - docs/VISION.md
  - docs/SOP.md
  - docs/design-system.md

# ── 脚本导出（managed_scripts）────────────────────────────────
# CI/构建脚本
managed_scripts:
  - scripts/check-dir-size.sh
  - scripts/start-dev.sh
  - scripts/check-feature-truth.mjs
  - scripts/generate-feature-index.mjs
  - scripts/audit-feature-doc-template.mjs
  - scripts/check-frontmatter.mjs
  - scripts/build-doc-index.mjs
  - scripts/preflight-shared-state.sh
  # 运行时可选服务（开源用户按需启用）
  - scripts/anthropic-proxy.mjs
  - scripts/init-cafe.sh
  - scripts/runtime-worktree.sh
  - scripts/qwen3-asr-server.sh
  - scripts/qwen3-asr-api.py
  - scripts/whisper-server.sh
  - scripts/whisper-api.py
  - scripts/tts-server.sh
  - scripts/tts-api.py
  - scripts/llm-postprocess-server.sh
  - scripts/llm-postprocess-api.py
  # 安装向导
  - scripts/setup.sh

# ── docs/ 生成型导出（由脚本生成，不直出原始文件）──────────────
# 这些文件由 sync 脚本的 transform 步骤生成到目标仓
docs_generated:
  - target: docs/ROADMAP.md
    source: docs/BACKLOG.md
    description: "从 BACKLOG 生成公开版 ROADMAP"

  - target: docs/public-lessons.md
    source: docs/lessons-learned.md
    description: "从 lessons-learned 生成公开版教训"

  - target: docs/README.md
    type: generate
    description: "开源版文档导航页"

  - target: docs/features/
    type: script
    script: scripts/export-public-feature-docs.mjs
    description: "Feature specs 结构化公开导出（conformant 自动，red 人工白名单）"

# ── docs/decisions/ allowlist（只导被公开文档引用的 ADR）────────
docs_decisions_allowlist:
  - docs/decisions/001-agent-invocation-approach.md
  - docs/decisions/002-collaboration-protocol.md
  - docs/decisions/003-project-thread-architecture.md
  - docs/decisions/008-conversation-mutability-and-invocation-lifecycle.md
  - docs/decisions/009-cat-cafe-skills-distribution.md
  - docs/decisions/010-directory-hygiene-anti-rot.md
  - docs/decisions/011-metadata-contract.md
  - docs/decisions/012-first-principles-map.md

# ── 排除（即使在 managed_roots 内也不导出）─────────────────────
excluded:
  # 内部文档目录（不在 managed_roots 中的整目录排除）
  - designs/
  - assets/
  # docs/ 下不导出的子目录（细粒度替代原来的 docs/ 一刀切）
  - docs/mailbox/
  - docs/discussions/
  - docs/stories/
  - docs/research/
  - docs/prompts/
  - docs/reflections/
  - docs/evidence/
  - docs/bug-report/
  - docs/archive/
  - docs/runbooks/
  - docs/evolution-proposals/
  - docs/phases/
  - docs/methods/
  - docs/plans/
  - docs/guides/
  - docs/episodes/
  - docs/lessons/
  - docs/scope-guard-log.md
  # docs/ 原始文件（由 transform 替代）
  - docs/BACKLOG.md
  - docs/lessons-learned.md
  - docs/TECH-DEBT.md
  # 内部运营 skill（F116: opensource-ops 不同步，KD-5）
  - cat-cafe-skills/opensource-ops/
  - cat-cafe-skills/refs/opensource-ops-issue-triage.md
  - cat-cafe-skills/refs/opensource-ops-inbound-pr.md
  - cat-cafe-skills/refs/opensource-ops-outbound-sync.md
  - cat-cafe-skills/refs/opensource-ops-labels.md
  - cat-cafe-skills/refs/opensource-ops-outbound-pr.md
  - cat-cafe-skills/refs/opensource-ops-hotfix.md
  # 内部运营 skills refs
  - cat-cafe-skills/refs/commit-signatures.md
  - cat-cafe-skills/refs/hyperfocus-brake-messages.md
  - cat-cafe-skills/refs/decision-matrix.md
  - cat-cafe-skills/refs/vision-evidence-workflow.md
  - cat-cafe-skills/refs/evidence-output-contract.md
  # 同步脚本自身
  - scripts/sync-to-opensource.sh
  - scripts/sync-to-tutorials.sh
  - scripts/export-public-feature-docs.mjs
  - sync-manifest.yaml
  # 敏感配置
  - cat-config.json          # 由 transform 生成脱敏版
  - CLAUDE.md                # 由 transform 生成通用版
  - AGENTS.md                # 由 transform 生成通用版
  - GEMINI.md                # 由 transform 生成通用版
  - README.md                # 由 transform 替换为开源版
  - README.opensource.md     # 源文件，不直接导出
  - CONTRIBUTING.md          # 由 transform 替换为开源版
  - CONTRIBUTING.opensource.md # 源文件，不直接导出
  - SETUP.md                 # 由 transform 替换为开源版（cat-cafe 没有内部 SETUP.md）
  - SETUP.opensource.md      # 源文件，不直接导出
  - .github/pull_request_template.md           # 由 transform 替换为开源版
  - .github/pull_request_template.opensource.md # 源文件，不直接导出
  # 运行时/部署
  - .env
  - .env.*
  - .claude/
  - node_modules/
  - dist/
  - .next/
  # 铲屎官头像（不导出）
  - packages/web/public/avatars/owner.jpg
  - packages/web/public/avatars/Landy.png
  # 杂项
  - "*.pen"
  - cdp-eval-test.cjs
  - cdp-send-diag.cjs
  - "story-export*.png"

# ── Transforms（导出时生成/替换的文件）────────────────────────
transforms:
  - target: cat-config.json
    type: generate
    description: "脱敏可运行版配置（含通用 owner section）"

  - target: CLAUDE.md
    type: generate
    description: "通用版 Claude Agent 指南（含铁律，去内部规则）"

  - target: AGENTS.md
    type: generate
    description: "通用版 OpenAI/Codex Agent 指南"

  - target: GEMINI.md
    type: generate
    description: "通用版 Gemini Agent 指南"

  - target: LICENSE
    type: generate
    description: "MIT License"

  - target: cat-cafe-skills/manifest.yaml
    type: sanitize
    description: "去 opensource-ops 条目（KD-5: 内部运营 skill 不暴露）"

  - target: cat-cafe-skills/BOOTSTRAP.md
    type: sanitize
    description: "去 opensource-ops 行（KD-5: 内部运营 skill 不暴露）"

  - target: cat-cafe-skills/refs/shared-rules.md
    type: sanitize
    description: "通用化第一性原理（去铲屎官个人引用）"

  - target: README.md
    type: generate
    source: README.opensource.md
    description: "开源版 README（从 README.opensource.md 复制）"

  - target: CONTRIBUTING.md
    type: generate
    source: CONTRIBUTING.opensource.md
    description: "开源版 CONTRIBUTING（intent-first + beta tester + 双语）"

  - target: SETUP.md
    type: generate
    source: SETUP.opensource.md
    description: "开源版 SETUP（双语安装指南，端口已改为 3003/3004）"

  - target: .github/pull_request_template.md
    type: generate
    source: .github/pull_request_template.opensource.md
    description: "开源版 PR 模板（去内部路径引用和猫猫签名）"

  - target: .env.example
    type: generate
    source: .env.example.opensource
    description: "开源版环境变量模板（端口 3003/3004，可选功能默认关闭）"

  # docs/ transform（v3 新增）
  - target: docs/VISION.md
    type: sanitize
    description: "脱敏（去铲屎官原话、内部猫名通用化）"

  - target: docs/SOP.md
    type: sanitize
    description: "通用化（去内部端口/猫名细节）"

  - target: docs/ROADMAP.md
    type: generate
    source: docs/BACKLOG.md
    description: "从 BACKLOG 生成公开版 ROADMAP"

  - target: docs/public-lessons.md
    type: generate
    source: docs/lessons-learned.md
    description: "从 lessons-learned 生成公开版教训"

  - target: docs/features/
    type: script
    script: scripts/export-public-feature-docs.mjs
    description: "Feature specs 结构化公开导出"

  - target: docs/decisions/
    type: sanitize
    description: "ADR allowlist 导出 + 脱敏"

# ── Denylist patterns（文件名匹配，零容忍）────────────────────
denylist_patterns:
  - ".env"
  - ".env.*"
  - ".pem"
  - ".key"
  - ".p12"
  - "cookies.json"
  - "dump.rdb"
  - "proxy-upstreams.json"
  - ".mcp.json"

# ── Endpoint scan patterns（文档/配置层额外扫描）──────────────
endpoint_scan_patterns:
  - "localhost:\\d{4,5}"
  - "127\\.0\\.0\\.1"
  - "192\\.168\\."
  - "10\\.\\d+\\.\\d+\\."
  - "@[a-zA-Z0-9.-]+\\.(internal|local|corp)"

# ── Internal path patterns（导出内容不应包含的内部路径）────────
internal_path_patterns:
  - "docs/mailbox"
  - "docs/plans"
  - "docs/discussions"
  - "\\.cat-cafe/"
  - "cat-cafe-runtime"
  - "6399"

# ── Target-owned（目标仓独有，sync 不删除）──────────────────────
target_owned_files:
  - .github/FUNDING.yml
  - .github/ISSUE_TEMPLATE/
  - .github/DISCUSSION_TEMPLATE/
  - CHANGELOG.md
  - MAINTAINERS.md           # 公开版 maintainer 指南（只在开源仓维护）
  - docs/community/

# ── Provenance（同步元数据）────────────────────────────────────
provenance:
  source_commit_sha: required
  manifest_version: required
  included_file_count: required
  excluded_file_count: required
  transform_count: required
  secret_scan_result: required
